name = "central-do-set"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Every 15 minutes: publish scheduled posts, fill in links, sync comments, refresh metrics (free plan friendly).
[triggers]
crons = ["*/15 * * * *"]

# The built app (Magnata Studio + Central do Set) is served from the same address as the API:
# one link, no CORS, no separate hosting. Build it first with `npm run build` in the repository root.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/oauth/*", "/media"]

[[d1_databases]]
binding = "DB"
database_name = "central-do-set"
database_id = "COLE_AQUI_O_ID_DO_D1"   # saída de: npx wrangler d1 create central-do-set

# Opcional (o R2 pede cartão na Cloudflare, mesmo no grátis). Sem ele, os vídeos ficam no armazenamento
# gratuito do Zernio, e tudo funciona no plano 100% grátis. Para usar o R2, descomente:
# [[r2_buckets]]
# binding = "VIDEOS"
# bucket_name = "central-do-set-videos"

[vars]
# Deixe vazios: o endereço é descoberto sozinho (app e API ficam no mesmo endereço).
# Só preencha se usar um domínio próprio ou abrir o app em outro lugar.
APP_URL = ""
API_URL = ""
R2_ACCOUNT_ID = "COLE_AQUI_O_ACCOUNT_ID_DA_CLOUDFLARE"
R2_BUCKET = "central-do-set-videos"
# Só mude para "true" depois que o TikTok aprovar o app para posts públicos (auditoria).
TIKTOK_PUBLIC = "false"
AI_MODEL = "claude-opus-5-5"

# Segredos (NUNCA neste arquivo). Configure com: npx wrangler secret put NOME
# SETUP_CODE             código de uso único para criar a senha no primeiro acesso
# TOKEN_KEY              chave para criptografar os tokens das redes (gere com: openssl rand -base64 32)
# R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY   token de API do R2 (leitura e escrita no bucket)
# As chaves dos apps do Instagram, YouTube e TikTok são coladas na própria Central (aba Contas).
# ANTHROPIC_API_KEY                          respostas de comentários com IA
